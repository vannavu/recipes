<body>
    <div class="wrapper">
    <main>
        <a href="../index.html"><div id="home">< RECIPES</div></a>
        <div class="recipe">
            <!--<img src="../images/image.jpg">-->
            <h2>Chili Mac</h2>
        </div>
        <div class="recipe_description">
            <p>ahhh</p>
        </div>
        <div class="ingredients_steps">
            <h2>Ingredients & Steps</h2>
            <h3>6 servings</h3>
            <div class="ingredients_group"><h3>meat</h3>

                <label class="ingredient"><span class="ingredient_amount">8</span> oz ground turkey<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">8</span> oz ground pork<input type="checkbox"><span class="checkmark"></span></label>

                <p>Season and brown</p>
                <p>Transfer to a bowl</p>

            </div>
            <div class="ingredients_group">

                <label class="ingredient"><span class="ingredient_amount">1/2</span> white onion, finely diced<input type="checkbox"><span class="checkmark"></span></label>

                <p>Cook until translucent</p>
                <br>

                <label class="ingredient"><span class="ingredient_amount">2</span> garlic cloves, chopped<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">1/2</span> tbsp ground cumin<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">1/2</span> tbsp chili powder<input type="checkbox"><span class="checkmark"></span></label>

                <p>Stir</p>
                <br>

                <label class="ingredient"><span class="ingredient_amount">1</span> chipotle pepper in adobo<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">8</span> oz tomato sauce<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">1/2</span> tbsp cocoa powder<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient">meat<input type="checkbox"><span class="checkmark"></span></label>

                <p>Simmer on low and occasionally stir for 30 minutes (add water if needed)</p>
                <br>

                <label class="ingredient"><span class="ingredient_amount">15</span> oz can of beans with liquid<input type="checkbox"><span class="checkmark"></span></label>

                <p>Add to pot and simmer for 10–15 minutes</p>
                <br>

                <label class="ingredient"><span class="ingredient_amount">3/4</span> tsp apple cider vinegar<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient">salt<input type="checkbox"><span class="checkmark"></span></label>

            </div>
            <div class="ingredients_group"><h3>toppings</h3>

                <label class="ingredient"><span class="ingredient_amount">4</span> oz grated sharp cheddar<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient">finely diced white onion<input type="checkbox"><span class="checkmark"></span></label>

                <label class="ingredient"><span class="ingredient_amount">12</span> oz macaroni<input type="checkbox"><span class="checkmark"></span></label>

            </div>

        </div>

            <h2>Sources</h2>

        </div>
        <div class="recipe_date">
            <p>June 2026</p>

    </main>
    </div>
